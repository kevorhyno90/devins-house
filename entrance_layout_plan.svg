<svg viewBox="0 0 1060 700" xmlns="http://www.w3.org/2000/svg" style="background:#06101e; font-family: 'Segoe UI', system-ui, sans-serif;">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e243f" stroke-width="1"/>
    </pattern>
    <linearGradient id="murram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a3412" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="stonePattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#334155"/>
      <circle cx="15" cy="15" r="10" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="30" cy="30" r="6" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title Header -->
  <rect x="30" y="20" width="1000" height="58" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="8"/>
  <text x="530" y="44" fill="#38bdf8" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">ARCHITECTURAL SITE PLAN: CONFIRMED ENTRANCE &amp; TRENCH LAYOUT</text>
  <text x="530" y="64" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">MAIN DOOR ON GLASS WALL • KITCHEN OUTLET AT FRONT • STONE-PITCHED CEMENT TRENCH</text>

  <!-- ZONE 1: PUBLIC RED MURRAM DIRT ROAD -->
  <rect x="30" y="100" width="170" height="530" fill="url(#murram)" stroke="#ea580c" stroke-width="2" rx="4"/>
  <text x="115" y="340" fill="#ffedd5" font-size="15" font-weight="900" text-anchor="middle" transform="rotate(-90 115 340)">PUBLIC RED MURRAM DIRT ROAD</text>
  <text x="115" y="370" fill="#fed7aa" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90 115 370)">(Heavy Dust in Dry Season • Mud Splash in Rain)</text>
  <line x1="80" y1="110" x2="80" y2="620" stroke="#7c2d12" stroke-width="10" stroke-dasharray="20,15"/>
  <line x1="150" y1="110" x2="150" y2="620" stroke="#7c2d12" stroke-width="10" stroke-dasharray="20,15"/>

  <!-- ZONE 2: 0.5m (500mm) STONE-PITCHED CEMENT TRENCH -->
  <rect x="200" y="100" width="60" height="530" fill="url(#stonePattern)" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="360" fill="#38bdf8" font-size="11" font-weight="900" text-anchor="middle" transform="rotate(-90 230 360)">0.5m STONE-PITCHED CEMENT TRENCH</text>

  <!-- ZONE 3: 2.3m SOLID BOUNDARY WALL & SLIDING GATE -->
  <rect x="260" y="100" width="22" height="170" fill="#cbd5e1" stroke="#f8fafc" stroke-width="2"/>
  <rect x="260" y="450" width="22" height="180" fill="#cbd5e1" stroke="#f8fafc" stroke-width="2"/>
  <text x="271" y="185" fill="#0f172a" font-size="9" font-weight="900" text-anchor="middle" transform="rotate(-90 271 185)">2.3m SOLID WALL</text>
  <text x="271" y="540" fill="#0f172a" font-size="9" font-weight="900" text-anchor="middle" transform="rotate(-90 271 540)">2.3m SOLID WALL</text>

  <!-- Sliding Gate (Opening from y=270 to y=450) -->
  <rect x="256" y="270" width="10" height="180" fill="#020617" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="261" y1="270" x2="261" y2="450" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="247" y="360" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle" transform="rotate(-90 247 360)">3.5m SLIDING GATE (Glides along wall)</text>

  <!-- ZONE 4: 1.0m (1,000mm) SETBACK CORRIDOR -->
  <rect x="282" y="100" width="150" height="530" fill="#0369a1" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="357" y="125" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">1.0m (3.3 ft) CORRIDOR</text>

  <!-- Raised Concrete Stepping Pavers -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="1.5">
    <rect x="312" y="140" width="90" height="42" rx="3"/>
    <rect x="312" y="195" width="90" height="42" rx="3"/>
    <rect x="312" y="250" width="90" height="42" rx="3"/>
    <rect x="312" y="305" width="90" height="42" rx="3" stroke="#f59e0b" stroke-width="2"/>
    <rect x="312" y="360" width="90" height="42" rx="3" stroke="#f59e0b" stroke-width="2"/>
    <rect x="312" y="415" width="90" height="42" rx="3" stroke="#38bdf8" stroke-width="2"/>
    <rect x="312" y="470" width="90" height="42" rx="3" stroke="#38bdf8" stroke-width="2"/>
    <rect x="312" y="525" width="90" height="42" rx="3" stroke="#38bdf8" stroke-width="2"/>
    <rect x="312" y="580" width="90" height="40" rx="3"/>
  </g>

  <!-- ZONE 5: HOUSE WALLS & DOORS -->
  <!-- Transverse Front Wall (Kitchen Area) -->
  <rect x="432" y="100" width="26" height="190" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  
  <!-- DOOR 1: KITCHEN OUTLET DOOR (Opening on front wall at y=290 to y=370) -->
  <rect x="432" y="290" width="26" height="80" fill="#b45309" stroke="#f59e0b" stroke-width="2.5"/>
  
  <!-- House Wall corner between Kitchen Outlet and Glass Wall -->
  <rect x="432" y="370" width="26" height="50" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

  <!-- THE LONG WALL HOLDING GLASSES & MAIN DOOR (y=420 to y=630) -->
  <!-- Upper Glass Panel Section (Window) -->
  <rect x="432" y="420" width="26" height="60" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="445" y="455" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle" transform="rotate(-90 445 455)">GLASS</text>

  <!-- DOOR 2: MAIN DOOR ON THE GLASS WALL (y=480 to y=570) -->
  <rect x="432" y="480" width="26" height="90" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="445" cy="525" r="4" fill="#fde047"/>

  <!-- Lower Glass Panel Section (Window continuing) -->
  <rect x="432" y="570" width="26" height="60" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <text x="445" y="605" fill="#ffffff" font-size="8" font-weight="900" text-anchor="middle" transform="rotate(-90 445 605)">GLASS</text>

  <!-- CALLOUT: KITCHEN OUTLET DOOR -->
  <rect x="490" y="300" width="280" height="60" fill="#1e1b4b" stroke="#f59e0b" stroke-width="2" rx="6"/>
  <text x="630" y="324" fill="#fbbf24" font-size="13" font-weight="900" text-anchor="middle">🚪 KITCHEN OUTLET DOOR</text>
  <text x="630" y="344" fill="#cbd5e1" font-size="11" text-anchor="middle">• 900mm × 2,100mm opening into Kitchen</text>
  <line x1="458" y1="330" x2="490" y2="330" stroke="#f59e0b" stroke-width="2"/>

  <!-- CALLOUT: MAIN DOOR ON THE WALL HOLDING GLASSES -->
  <rect x="490" y="485" width="360" height="85" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5" rx="6"/>
  <text x="670" y="510" fill="#38bdf8" font-size="14" font-weight="900" text-anchor="middle">👑 MAIN ENTRANCE DOOR (3.5ft / 1,070mm)</text>
  <text x="670" y="530" fill="#f0f9ff" font-size="12" font-weight="700" text-anchor="middle">• Sits directly on the wall holding glasses</text>
  <text x="670" y="548" fill="#bae6fd" font-size="11" text-anchor="middle">• Integrated below/beside modern glass panels</text>
  <text x="670" y="563" fill="#94a3b8" font-size="10" text-anchor="middle">• Enters into Living Room Foyer</text>
  <line x1="458" y1="525" x2="490" y2="525" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Interior Rooms -->
  <rect x="458" y="100" width="570" height="190" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="740" y="200" fill="#475569" font-size="16" font-weight="900" text-anchor="middle">KITCHEN INTERIOR (Under Master Bedroom)</text>

  <rect x="458" y="370" width="570" height="260" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="740" y="440" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">LIVING ROOM (Double Height Ceiling)</text>

  <!-- Flow Arrows -->
  <path d="M 261 360 L 357 360" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  <!-- Branch to Kitchen -->
  <path d="M 357 360 L 357 330 L 432 330 M 420 322 L 432 330 L 420 338" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
  <!-- Branch to Main Door -->
  <path d="M 357 360 L 357 525 L 432 525 M 420 517 L 432 525 L 420 533" stroke="#38bdf8" stroke-width="3" fill="none"/>

  <!-- DIMENSION LINES -->
  <!-- 0.5m Shoulder -->
  <line x1="200" y1="655" x2="260" y2="655" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="648" x2="200" y2="662" stroke="#38bdf8" stroke-width="2"/>
  <line x1="260" y1="648" x2="260" y2="662" stroke="#38bdf8" stroke-width="2"/>
  <text x="230" y="675" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">0.5m (20")</text>

  <!-- 1.0m Corridor -->
  <line x1="282" y1="655" x2="432" y2="655" stroke="#34d399" stroke-width="2"/>
  <line x1="282" y1="648" x2="282" y2="662" stroke="#34d399" stroke-width="2"/>
  <line x1="432" y1="648" x2="432" y2="662" stroke="#34d399" stroke-width="2"/>
  <text x="357" y="675" fill="#34d399" font-size="13" font-weight="900" text-anchor="middle">1.0 m (3.3 ft)</text>

  <!-- Wall Height Callout -->
  <text x="271" y="660" fill="#94a3b8" font-size="10" font-weight="700">H = 2.3m</text>
</svg>

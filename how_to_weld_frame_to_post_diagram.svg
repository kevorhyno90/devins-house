<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" style="background:#090d16; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="squarePipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="timberGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="960" height="660" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="500" y="55" fill="#38bdf8" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">HOW THE ANGLE-LINE RECTANGLE WELDS TO THE SQUARE PIPE POST</text>
  <text x="500" y="82" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Method 1: The "Center Bridge" Angle Bar Connection (Exploded Isometric View)</text>

  <!-- ========================================== -->
  <!-- 1. MAIN SLANTED BEAM & VERTICAL SQUARE POST -->
  <!-- ========================================== -->
  <g id="central-post-and-beam" transform="translate(400, 360)">
    <!-- Slanted Beam Segment (Diagonal behind) -->
    <path d="M -160,180 L 140,-40 L 190,-10 L -110,210 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M -160,180 L -110,210 L -110,260 L -160,230 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="-140" y="250" fill="#64748b" font-size="11" font-weight="700">SLANTED MAIN BEAM (38°)</text>

    <!-- Vertical Square Pipe Post (Cut piece) -->
    <!-- Front Face -->
    <rect x="-40" y="0" width="80" height="130" fill="url(#squarePipeGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Right Face (Isometric 3D) -->
    <polygon points="40,0 85,-25 85,105 40,130" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- Top Face (Where weld lands) -->
    <polygon points="-40,0 5,-25 85,-25 40,0" fill="#475569" stroke="#64748b" stroke-width="2"/>
    
    <text x="0" y="75" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">VERTICAL</text>
    <text x="0" y="92" fill="#f8fafc" font-size="12" font-weight="800" text-anchor="middle">SQUARE POST</text>
    <text x="0" y="108" fill="#94a3b8" font-size="10" text-anchor="middle">(Cut from same pipe)</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. THE CENTER BRIDGE PIECE (GREEN HIGHLIGHT) -->
  <!-- ========================================== -->
  <g id="center-bridge" transform="translate(400, 340)">
    <!-- 10" Angle Line Bridge sitting on post -->
    <!-- Horizontal flange of the bridge -->
    <polygon points="-35, -20  15, -60  55, -35  5, 5" fill="url(#bridgeGrad)" stroke="#10b981" stroke-width="2"/>
    <!-- Vertical flange of the bridge -->
    <polygon points="-35, -20  5, 5  5, 30  -35, 5" fill="#047857" stroke="#10b981" stroke-width="1.5"/>

    <!-- WELD BEADS (Golden Glow) -->
    <ellipse cx="25" cy="-10" rx="14" ry="4" fill="#fbbf24" filter="url(#glow)"/>
    <ellipse cx="-15" cy="5" rx="12" ry="4" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Weld Callout Arrow -->
    <line x1="70" y1="-8" x2="160" y2="40" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3,3"/>
    <circle cx="70" cy="-8" r="4" fill="#fbbf24"/>
    <rect x="160" y="20" width="220" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="170" y="38" fill="#fbbf24" font-size="11" font-weight="800">🔥 STRONG WELD BEAD HERE</text>
    <text x="170" y="54" fill="#f8fafc" font-size="10">Welds Top of Square Post directly</text>
    <text x="170" y="66" fill="#f8fafc" font-size="10">to Center Bridge Angle Bar!</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. THE RECTANGULAR ANGLE FRAME (30" x 10") -->
  <!-- ========================================== -->
  <g id="rectangle-frame" transform="translate(400, 240)">
    <!-- REAR ANGLE BAR (Cyan) -->
    <polygon points="-280,-120  280,-120  295,-105  -265,-105" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="-280,-120  -280,-90  280,-90  280,-120" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-100" fill="#e0f2fe" font-size="11" font-weight="800" text-anchor="middle">REAR 2"x2" ANGLE LINE (30" Long)</text>

    <!-- LEFT SIDE ANGLE BAR -->
    <polygon points="-280,-120  -265,-105  -215,35  -230,20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="-280,-120  -230,20  -230,50  -280,-90" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>

    <!-- RIGHT SIDE ANGLE BAR -->
    <polygon points="280,-120  295,-105  345,35  330,20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="280,-120  330,20  330,50  280,-90" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>

    <!-- FRONT ANGLE BAR (Foreground) -->
    <polygon points="-230,20  330,20  345,35  -215,35" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="-230,20  -230,50  330,50  330,20" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="50" y="40" fill="#e0f2fe" font-size="11" font-weight="800" text-anchor="middle">FRONT 2"x2" ANGLE LINE (30" Long)</text>

    <!-- CENTER BRIDGE ANGLE BAR (In the frame) -->
    <polygon points="-15,-105  15,-105  65,35  35,35" fill="url(#bridgeGrad)" stroke="#10b981" stroke-width="2"/>
    <polygon points="15,-105  35,-85  85,55  65,35" fill="#047857" stroke="#10b981" stroke-width="1.5"/>

    <!-- CORNER WELDS (Golden) -->
    <circle cx="-255" cy="-97" r="5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="288" cy="-97" r="5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="-222" cy="27" r="5" fill="#fbbf24" filter="url(#glow)"/>
    <circle cx="338" cy="27" r="5" fill="#fbbf24" filter="url(#glow)"/>
    
    <!-- Center Bridge Joint Welds -->
    <ellipse cx="0" cy="-105" rx="8" ry="3" fill="#fbbf24" filter="url(#glow)"/>
    <ellipse cx="50" cy="35" rx="8" ry="3" fill="#fbbf24" filter="url(#glow)"/>

    <!-- Pre-drilled Bolt Holes in Angle Flange -->
    <circle cx="-160" cy="-70" r="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="160" cy="-70" r="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="-130" cy="10" r="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="190" cy="10" r="4" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="-160" y="-80" fill="#38bdf8" font-size="10" font-weight="700">Pre-drilled Hole</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. TIMBER TREAD (GHOSTED / DROPPING IN)    -->
  <!-- ========================================== -->
  <g id="timber-step" transform="translate(400, 110)">
    <!-- Dropping Arrow -->
    <line x1="50" y1="50" x2="50" y2="105" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="50,115  44,103  56,103" fill="#f59e0b"/>
    <text x="65" y="85" fill="#fbbf24" font-size="11" font-weight="800">WOOD DROPS IN</text>

    <!-- Translucent Timber Tread Block -->
    <polygon points="-250,-80  250,-80  300,40  -200,40" fill="url(#timberGrad)" opacity="0.85" stroke="#d97706" stroke-width="2"/>
    <polygon points="-200,40  300,40  300,75  -200,75" fill="#b45309" opacity="0.9" stroke="#d97706" stroke-width="2"/>
    <polygon points="300,40  250,-80  250,-45  300,75" fill="#78350f" opacity="0.9" stroke="#d97706" stroke-width="2"/>
    <text x="50" y="0" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0.5">SOLID TIMBER TREAD (1.75" - 2" THICK)</text>
    <text x="50" y="20" fill="#fef3c7" font-size="11" text-anchor="middle">Drops inside the 2" angle-line rim; screws from underneath</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. ANNOTATIONS & INSTRUCTIONS BOXES        -->
  <!-- ========================================== -->
  <!-- Left Instruction Card -->
  <g transform="translate(50, 480)">
    <rect width="280" height="170" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="15" y="28" fill="#38bdf8" font-size="13" font-weight="800">🛠️ STEP 1: MAKE THE RECTANGLE</text>
    <text x="15" y="52" fill="#cbd5e1" font-size="11">• Cut 4 pieces of 2"x2" angle line.</text>
    <text x="15" y="70" fill="#cbd5e1" font-size="11">• 2 pieces @ 30" (front &amp; back).</text>
    <text x="15" y="88" fill="#cbd5e1" font-size="11">• 2 pieces @ 10" (sides).</text>
    <text x="15" y="106" fill="#34d399" font-size="11" font-weight="700">• KEY: Cut 1 extra 10" piece (Center Bridge).</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="11">• Weld the center bridge right down</text>
    <text x="15" y="140" fill="#cbd5e1" font-size="11">  the middle of the rectangle!</text>
  </g>

  <!-- Right Instruction Card -->
  <g transform="translate(670, 480)">
    <rect width="280" height="170" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="28" fill="#34d399" font-size="13" font-weight="800">⚡ STEP 2: WELD TO SQUARE POST</text>
    <text x="15" y="52" fill="#cbd5e1" font-size="11">• Set the rectangle frame on top</text>
    <text x="15" y="70" fill="#cbd5e1" font-size="11">  of your vertical square pipe post.</text>
    <text x="15" y="88" fill="#fbbf24" font-size="11" font-weight="700">• That Green Center Bridge sits</text>
    <text x="15" y="106" fill="#fbbf24" font-size="11" font-weight="700">  DIRECTLY ON TOP of the square pipe!</text>
    <text x="15" y="124" fill="#cbd5e1" font-size="11">• Run heavy weld beads along both</text>
    <text x="15" y="140" fill="#cbd5e1" font-size="11">  sides where the pipe touches the bridge.</text>
    <text x="15" y="156" fill="#38bdf8" font-size="10" font-weight="700">RESULT: 100% Solid &amp; Cannot Move!</text>
  </g>

  <!-- Dimension Indicator -->
  <g transform="translate(140, 240)">
    <line x1="0" y1="0" x2="0" y2="160" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="-15" y="85" fill="#94a3b8" font-size="11" font-weight="700" transform="rotate(-90 -15 85)">STEP DEPTH: 10" (250mm)</text>
  </g>
</svg>

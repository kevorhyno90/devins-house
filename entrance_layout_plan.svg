rs into Living Room Foyer</text><line x1="458" x2="490" y1="525" y2="525" stroke="#38bdf8" stroke-width="2.5"/><rect width="570" height="190" x="458" y="100" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/><text x="740" y="200" fill="#475569" font-size="16" font-weight="900" text-anchor="middle">KITCHEN INTERIOR (Under Master Bedroom)</text><rect width="570" height="260" x="458" y="370" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/><text x="740" y="440" fill="#38bdf8" font-size="15" font-weight="800" text-anchor="middle">LIVING ROOM (Double Height Ceiling)</text><path stroke="#fbbf24" stroke-linecap="round" stroke-width="3" d="M 261 360 L 357 360"/><path fill="none" stroke="#f59e0b" stroke-width="2.5" d="M 357 360 L 357 330 L 432 330 M 420 322 L 432 330 L 420 338"/><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 357 360 L 357 525 L 432 525 M 420 517 L 432 525 L 420 533"/><line x1="200" x2="260" y1="655" y2="655" stroke="#38bdf8" stroke-width="2"/><line x1="200" x2="200" y1="648" y2="662" stroke="#38bdf8" stroke-width="2"/><line x1="260" x2="260" y1="648" y2="662" stroke="#38bdf8" stroke-width="2"/><text x="230" y="675" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">0.5m (20&quot;)</text><line x1="282" x2="432" y1="655" y2="655" stroke="#34d399" stroke-width="2"/><line x1="282" x2="282" y1="648" y2="662" stroke="#34d399" stroke-width="2"/><line x1="432" x2="432" y1="648" y2="662" stroke="#34d399" stroke-width="2"/><text x="357" y="675" fill="#34d399" font-size="13" font-weight="900" text-anchor="middle">1.0 m (3.3 ft)</text><text x="271" y="660" fill="#94a3b8" font-size="10" font-weight="700">H = 2.3m</text></svg>